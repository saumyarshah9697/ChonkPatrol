<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chonk Puzzle</title>
  <style>
    :root {
      --cream: #fdf6ec;
      --warm-wood: #b98a5e;
      --ink: #5a4a3f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    h1 { font-weight: normal; letter-spacing: 0.06em; font-size: clamp(1.4rem, 6vw, 1.9rem); margin: 8px 0 2px; }
    .moves { opacity: 0.75; margin: 2px 0 14px; }
    .board {
      position: relative;
      width: min(88vw, 440px);
      height: min(88vw, 440px);
      background: var(--warm-wood);
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 14px 34px rgba(90, 74, 63, 0.22);
      touch-action: manipulation;
    }
    .tile {
      position: absolute;
      border-radius: 8px;
      background-size: 300% 300%;
      cursor: pointer;
      transition: top 0.15s ease, left 0.15s ease;
      box-shadow: inset 0 0 0 1px rgba(253, 246, 236, 0.5);
    }
    .win {
      margin-top: 16px;
      font-size: 1.1rem;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .win.show { opacity: 1; }
    .controls { margin-top: 14px; display: flex; gap: 10px; }
    button, .back {
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(150, 104, 63, 0.35);
      border-radius: 999px;
      padding: 8px 18px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Chonk Puzzle</h1>
  <p class="moves" id="moves">Moves: 0</p>
  <div class="board" id="board"></div>
  <p class="win" id="win">Purrfect! You put the chonk back together 🐈</p>
  <div class="controls">
    <button id="shuffle">🔀 Shuffle puzzle</button>
    <button id="picture">🖼️ Shuffle picture</button>
    <a class="back" href="../">🐈 Back to Chonk Patrol</a>
  </div>

  <script src="images.js"></script>
  <script>
    (function () {
      "use strict";

      const N = 3;
      const STORAGE_KEY = "chonk.puzzle";
      const IMAGES = (window.CHONK_PUZZLE_IMAGES && window.CHONK_PUZZLE_IMAGES.length > 0)
        ? window.CHONK_PUZZLE_IMAGES
        : ["cat.jpg"];
      const board = document.getElementById("board");
      const movesEl = document.getElementById("moves");
      const winEl = document.getElementById("win");

      // positions[tileIndex] = current cell (0..8); tile N*N-1 is the blank
      let positions = [];
      let moves = 0;
      let won = false;
      let imageIndex = 0;

      function cellXY(cell) {
        return { row: Math.floor(cell / N), col: cell % N };
      }

      function tileSize() {
        return (board.clientWidth - 12) / N;
      }

      function render() {
        const size = tileSize();
        board.querySelectorAll(".tile").forEach(function (el) {
          const tile = Number(el.dataset.tile);
          const pos = cellXY(positions[tile]);
          el.style.backgroundImage = 'url("' + IMAGES[imageIndex] + '")';
          el.style.width = size + "px";
          el.style.height = size + "px";
          el.style.left = 6 + pos.col * size + "px";
          el.style.top = 6 + pos.row * size + "px";
        });
        movesEl.textContent = "Moves: " + moves;
        winEl.classList.toggle("show", won);
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            positions: positions,
            moves: moves,
            won: won,
            imageIndex: imageIndex,
          }));
        } catch (err) { /* private mode: state just won't survive reloads */ }
      }

      function restore() {
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        } catch (err) {
          return false;
        }
        if (!saved || !Array.isArray(saved.positions)) return false;
        if (saved.positions.length !== N * N) return false;
        const sorted = saved.positions.slice().sort(function (a, b) { return a - b; });
        for (let i = 0; i < N * N; i++) {
          if (sorted[i] !== i) return false;
        }
        positions = saved.positions;
        moves = typeof saved.moves === "number" ? saved.moves : 0;
        won = saved.won === true;
        imageIndex =
          typeof saved.imageIndex === "number" &&
          saved.imageIndex >= 0 &&
          saved.imageIndex < IMAGES.length
            ? saved.imageIndex
            : 0;
        return true;
      }

      function blankCell() {
        return positions[N * N - 1];
      }

      function isAdjacent(a, b) {
        const pa = cellXY(a);
        const pb = cellXY(b);
        return Math.abs(pa.row - pb.row) + Math.abs(pa.col - pb.col) === 1;
      }

      function tryMove(tile, countIt) {
        if (won && countIt) return;
        const from = positions[tile];
        const blank = blankCell();
        if (!isAdjacent(from, blank)) return;
        positions[tile] = blank;
        positions[N * N - 1] = from;
        if (countIt) {
          moves++;
          checkWin();
          render();
          save();
        }
      }

      function checkWin() {
        won = positions.every(function (cell, tile) { return cell === tile; });
      }

      function shuffle() {
        positions = [];
        for (let i = 0; i < N * N; i++) positions.push(i);
        // random legal moves from solved state -> always solvable
        for (let i = 0; i < 250; i++) {
          const movable = [];
          for (let t = 0; t < N * N - 1; t++) {
            if (isAdjacent(positions[t], blankCell())) movable.push(t);
          }
          tryMove(movable[Math.floor(Math.random() * movable.length)], false);
        }
        moves = 0;
        won = false;
        render();
        save();
      }

      function build() {
        for (let tile = 0; tile < N * N - 1; tile++) {
          const el = document.createElement("div");
          el.className = "tile";
          el.dataset.tile = String(tile);
          const home = cellXY(tile);
          el.style.backgroundPosition =
            (home.col * 100) / (N - 1) + "% " + (home.row * 100) / (N - 1) + "%";
          el.addEventListener("click", function () { tryMove(tile, true); });
          board.appendChild(el);
        }
      }

      document.getElementById("shuffle").addEventListener("click", shuffle);
      document.getElementById("picture").addEventListener("click", function () {
        imageIndex = (imageIndex + 1) % IMAGES.length;
        render();
        save();
      });
      window.addEventListener("resize", render);

      // small hooks for testing
      window.__puzzle = {
        state: function () { return positions.slice(); },
        isSolved: function () { return positions.every(function (c, t) { return c === t; }); },
        move: function (t) { tryMove(t, true); },
      };

      IMAGES.forEach(function (src) {
        const img = new Image();
        img.src = src;
      });

      build();
      if (restore()) {
        render();
      } else {
        imageIndex = Math.floor(Math.random() * IMAGES.length);
        shuffle();
      }
    })();
  </script>
</body>
</html>

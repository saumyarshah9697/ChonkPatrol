<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chonk Patrol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1 class="title">Chonk Patrol</h1>
    <p class="score" id="score">Cats spotted: 0</p>

    <div class="window-frame">
      <div class="scene" id="scene">
        <div class="sky">
          <div class="sun"></div>
          <div class="cloud cloud-1"></div>
          <div class="cloud cloud-2"></div>
          <div class="cloud cloud-3"></div>
        </div>
        <div class="skyline">
          <div class="tree tree-1">🌳</div>
          <div class="house">🏠</div>
          <div class="tree tree-2">🌲</div>
          <div class="fence"></div>
        </div>
        <div class="pane-divider pane-divider-v"></div>
        <div class="pane-divider pane-divider-h"></div>
        <div class="milestone" id="milestone"></div>
      </div>
      <div class="windowsill">
        <span class="sill-plant">🪴</span>
        <span class="sill-mug">☕</span>
      </div>
    </div>

    <div class="ending" id="ending">
      <div class="ending-card">
        <p class="ending-emoji">🐈</p>
        <p class="ending-text">You spotted them all for now.</p>
        <p class="ending-sub">The cats will wander back when they're ready. Take a stretch, have some tea.</p>
        <button class="ending-button" id="keep-watching">Keep watching the window</button>
      </div>
    </div>

    <p class="dedication">For Arina 🤍</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
